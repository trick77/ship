name: Cleanup images

# Reusable: keep the newest tagged versions of each ghcr package, delete the rest (orphaned untagged included;
# multi-arch and attestation children of kept images are protected; cosign signatures are never touched). A
# caller's cleanup-images.yaml:
#
#   on: workflow_dispatch
#   jobs:
#     cleanup:
#       uses: trick77/ship/.github/workflows/cleanup-images.yaml@master
#       with: { packages: '["core", "core-dashboard"]'   # ghcr.io/<owner>/<repo><suffix>, as ship release names them }
#       permissions: { contents: read, packages: write }
on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of container package names.
        type: string
        required: true
      keep:
        type: number
        default: 10
      dry-run:
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      # container-retention-policy panics on a package that does not exist yet (before the first release). Only a
      # 404 means "not published yet": treating every non-2xx so would let a 403 skip retention forever, green.
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
        run: |
          # container-retention-policy takes the org name, or the literal "user" for a personal account.
          # A failed lookup must fail the step: defaulting to orgs would 404 a personal account, read as "no
          # package yet", and skip retention with a green job.
          type=$(gh api "users/$OWNER" --jq .type) || { echo "::error::owner lookup failed for $OWNER"; exit 1; }
          kind=orgs account="$OWNER"
          if [ "$type" = User ]; then kind=users account=user; fi
          echo "account=$account" >> "$GITHUB_OUTPUT"
          status=$(gh api "$kind/$OWNER/packages/container/$PACKAGE" --silent -i 2>/dev/null | head -n1 | awk '{print $2}' || true)
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No $PACKAGE package yet." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::packages API status '${status:-none}' for $PACKAGE"; exit 1 ;;
          esac
      - if: steps.exists.outputs.exists == 'true'
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ steps.exists.outputs.account }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ matrix.package }}
          tag-selection: both
          # cosign's signatures live under tags sha256-<digest> (the OCI referrers fallback index, ghcr has no
          # referrers API) or sha256-<digest>.sig (cosign's legacy layout). A negative tag match drops a version from
          # the selection before keep-n-most-recent counts, so a signature neither goes nor takes a keep slot; still
          # a kept tagged version, its index's children (the signature bundles) are protected as multi-arch children
          # are. Tag filters work with GITHUB_TOKEN, only image-names filters do not. (v3.1.0 src/core/
          # select_package_versions.rs filter_by_matchers, kept_tagged_digests; filter_out_multi_arch_children.rs.)
          # A deleted image's signature stays behind: a few KB, never a broken one.
          image-tags: "!sha256-*"
          keep-n-most-recent: ${{ inputs.keep }}
          # Never catch a release pushed in the last hour.
          cut-off: 1h
          dry-run: ${{ inputs.dry-run }}
