name: CI

# Every pull request and every master push, unlike the consumers' CI (pull requests only, private repos Dependabot
# alone): a bug here breaks every repo's push, and master's run releases. The full gate on Linux, as consumers' CI
# runs it.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # The weekly govulncheck consumers' vuln.yaml runs: the vuln job alone.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The schedule its own group: on master's it would cancel a pending push run, and that push's release with it.
  group: ci-${{ github.event_name == 'schedule' && 'vuln' || github.ref }}
  # Never on master: a second push would cancel the release mid-flight, leaving a tag without its GitHub release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/check.yaml
    with:
      ship: go run .
      # Node for the UI end-to-end test (internal/check/ui_test.go) on testdata/ui.
      node-version: "22"
      ui-dir: testdata/ui

  vuln:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/vuln.yaml
    with:
      ship: go run .

  # A merge is already live for every consumer (they run master's sha): tag it, with notes, once the gate passes.
  # auto: patch, or a `Release: minor|major` + `Release-note:` line in a commit; docs/tests only → no release.
  # Each module on its own (tags v…, kit/v…, kit/auth/v…), only its own changes count; one not merged yet skips.
  # The dirs: ship itself ("") and ship.yaml's go.modules, kept equal by a test (workflows_test.go).
  release:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        dir: ["", kit, kit/auth]
    uses: ./.github/workflows/release.yaml
    with:
      bump: auto
      dir: ${{ matrix.dir }}
      ship: go run .
    permissions:
      contents: write
