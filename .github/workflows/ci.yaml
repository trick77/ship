name: CI

# Every pull request and every master push, unlike the consumers' CI (pull requests only, private repos Dependabot
# alone): a bug here breaks every repo's push, and master's run releases. The full gate on Linux (as consumers' CI runs it), the tests on macOS (as their
# pre-push hooks run it).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never on master: a second push would cancel the release mid-flight, leaving a tag without its GitHub release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    uses: ./.github/workflows/check.yaml
    with:
      ship: go run .
      # Node for the UI end-to-end test (internal/check/ui_test.go) on testdata/ui.
      node-version: "22"
      ui-dir: testdata/ui

  test-macos:
    name: go test (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: testdata/ui/package-lock.json
      - run: go test -race -count=1 ./...

  # A merge is already live for every consumer (they run master's sha): tag it, with notes, once both gates pass.
  # auto: patch, or a `Release: minor|major` + `Release-note:` line in a commit; docs/tests only → no release.
  # Each module on its own (tags v…, kit/v…, kit/auth/v…), only its own changes count; one not merged yet skips.
  # The modules release cuts: ship itself ("") and ship.yaml's go.modules, the one list. On every run, so a broken
  # read shows on the PR, not first on master. yq: preinstalled on GitHub's ubuntu runner images.
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - id: dirs
        run: |
          dirs="$(yq -o=json -I=0 '[""] + (.go.modules // [])' ship.yaml)"
          # Raw, as written: each entry must already be ship's cleaned form (kit/auth, not ./kit/auth/), the -dir and
          # tag prefix release spells from it. Each once, none empty: a matrix entry is a release run.
          echo "$dirs" | jq -e 'type == "array" and length > 0 and all(type == "string") and
            length == (unique | length) and
            (.[1:] | all(. != "" and (split("/") | all(. != "" and . != "." and . != ".."))))' >/dev/null ||
            { echo "::error::ship.yaml go.modules: $dirs, want clean repo-relative dirs (kit/auth), each once"; exit 1; }
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "release modules: $dirs"

  release:
    needs: [check, test-macos, modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.modules.outputs.dirs) }}
    uses: ./.github/workflows/release.yaml
    with:
      bump: auto
      dir: ${{ matrix.dir }}
      ship: go run .
    permissions:
      contents: write
