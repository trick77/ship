name: Check

# Reusable: `ship check` on a GitHub runner, the same gate the pre-push hook runs locally. A caller's ci.yaml:
#
#   on: workflow_dispatch
#   jobs:
#     check:
#       uses: trick77/ship/.github/workflows/check.yaml@master
#       with: { node-version: "22" }   # only with a UI
on:
  workflow_call:
    inputs:
      go-dir:
        description: Go module directory.
        type: string
        default: "."
      node-version:
        description: Node version for the UI; empty = no UI.
        type: string
        default: ""
      ui-dir:
        type: string
        default: ui
      ship:
        description: How to run ship; empty = ship at this workflow's own commit, else master. ship's own repo uses "go run .".
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: ship check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0: the patch gate diffs against origin/<base>.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum
      - if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.ui-dir }}/package-lock.json
      - working-directory: ${{ inputs.go-dir }}
        env:
          # The binary from this workflow's own commit: a consumer calling @master never pairs it with an older release.
          # github.job_workflow_sha comes out empty for a caller (2026-10-11: "version must not be empty"): then @master.
          SHIP: >-
            ${{ inputs.ship || github.job_workflow_sha != '' && format('go run github.com/trick77/ship@{0}',
            github.job_workflow_sha) || 'go run github.com/trick77/ship@master' }}
        run: $SHIP check
