name: Check

# Reusable: `ship check` on a GitHub runner, the same gate the pre-push hook runs locally. A caller's ci.yaml, head
# comment included. Private repo:
#
#   # Dependabot PRs only (Actions minutes): own pushes are gated by the pre-push hook, a bot PR has none.
#   # By hand: gh workflow run CI --ref <branch>
#
# Public repo, this head comment instead and no `if:` below:
#
#   # Every pull request, fork PRs included (read-only token, no secrets): Dependabot and outside contributors have no
#   # pre-push hook. Own pushes are gated by the hook already. By hand: gh workflow run CI --ref <branch>
#
# Then:
#
#   on:
#     pull_request:
#       branches: [master]
#     workflow_dispatch:
#   permissions:
#     contents: read
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     check:
#       if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'   # private only
#       uses: trick77/ship/.github/workflows/check.yaml@master
#       with: { node-version: "22" }   # only with a UI
on:
  workflow_call:
    inputs:
      go-dir:
        description: Go module directory.
        type: string
        default: "."
      node-version:
        description: Node version for the UI; empty = no UI.
        type: string
        default: ""
      ui-dir:
        type: string
        default: ui
      ship:
        description: How to run ship; empty = ship at master's sha on GitHub. ship's own repo uses "go run .".
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: ship check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0: the patch gate diffs against origin/<base>.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum
      - if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.ui-dir }}/package-lock.json
      - working-directory: ${{ inputs.go-dir }}
        env:
          SHIP: ${{ inputs.ship }}
          # A squash merge makes the PR title master's subject: the gate checks it with the branch's. Through env,
          # never ${{ }} in the script: a title is untrusted input. Empty off a pull_request event, and for a bot's PR
          # (Dependabot: `Bump x from …`, past 76 chars), skipped as its commits are.
          SHIP_PR_TITLE: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.title || '' }}
          # A fork PR: only the title is checked, the squash merge drops the contributor's branch subjects.
          SHIP_PR_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        # Default: master's sha on GitHub, as the pre-push hook runs it, so hook and CI gate alike. Not @master: the
        # module proxy can still serve an older master. Not github.job_workflow_sha: empty for a caller (2026-10-11).
        run: |
          if [ -z "$SHIP" ]; then
            # Exactly refs/heads/master: ls-remote matches by suffix, so x/refs/heads/master would match too.
            sha="$(git ls-remote https://github.com/trick77/ship refs/heads/master | awk '$2 == "refs/heads/master" { print $1 }')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve ship's master on GitHub: '$sha'"; exit 1; }
            SHIP="go run github.com/trick77/ship@$sha"
          fi
          $SHIP check
