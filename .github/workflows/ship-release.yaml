name: Ship release

# By hand: tags ship itself (v-prefixed, a Go module). CI cuts it on every master push (bump auto); this is the
# fallback when that run failed, or to force a size.
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major, auto]
        default: patch

jobs:
  release:
    uses: ./.github/workflows/release.yaml
    with:
      bump: ${{ inputs.bump }}
      ship: go run .
    permissions:
      contents: write
