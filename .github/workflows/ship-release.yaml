name: Ship release

# By hand: tags ship itself (v-prefixed, a Go module). Usually run locally instead: go run . release minor
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    uses: ./.github/workflows/release.yaml
    with:
      bump: ${{ inputs.bump }}
      ship: go run .
    permissions:
      contents: write
      packages: write
