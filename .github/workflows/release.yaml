name: Release

# Reusable: `ship release` on a GitHub-hosted runner, the only place a repo with images releases. A caller's
# release.yaml:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         bump: { type: choice, options: [patch, minor, major], default: patch }
#   jobs:
#     release:
#       uses: trick77/ship/.github/workflows/release.yaml@master
#       with: { bump: "${{ inputs.bump }}" }
#       permissions: { contents: write, packages: write }
on:
  workflow_call:
    inputs:
      bump:
        type: string
        default: patch
      go-dir:
        type: string
        default: "."
      ship:
        description: How to run ship; empty = ship at this workflow's own commit.
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Exposes the Actions cache to buildx for --cache gha.
      - uses: crazy-max/ghaction-github-runtime@v4
      - working-directory: ${{ inputs.go-dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The binary from this workflow's own commit: a consumer calling @master never pairs it with an older release.
          SHIP: ${{ inputs.ship || format('go run github.com/trick77/ship@{0}', github.job_workflow_sha) }}
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in patch|minor|major) ;; *) echo "::error::bump '$BUMP'"; exit 1 ;; esac
          $SHIP release "$BUMP" -cache gha
