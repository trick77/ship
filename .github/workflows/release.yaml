name: Release

# Reusable: `ship release` on a GitHub-hosted runner, the only place a repo with images releases. A caller's
# release.yaml:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         bump: { type: choice, options: [patch, minor, major, auto], default: patch }
#   jobs:
#     release:
#       uses: trick77/ship/.github/workflows/release.yaml@master
#       with: { bump: "${{ inputs.bump }}" }
#       permissions: { contents: write, packages: write, id-token: write }   # no images (ship.yaml): contents: write only
#
# The release job sets no permissions of its own: it inherits the caller's grant, so a repo without images needs
# neither packages: write nor id-token: write (cosign's keyless signature: the workflow's OIDC token). The docker and
# cosign steps run only when ship.yaml has images:.
#
# The gate job runs check.yaml (the caller's CI gate) on the commit first: a PR gated against an older master and
# rebase-merged onto a newer one was never checked as merged (loom 0.10.2: two PRs each added a migration 0053, each
# green alone; the release refused to boot). Its own job, read-only: the gate runs the repo's code and its npm
# install scripts, never next to the release's write token, OIDC token and registry login. The template's caller
# passes no gate input (conform keeps it so): a gate failing on master fails the repo's pushes the same way. The gate
# calls check.yaml as the template's ci.yaml does (no postgres input, no secrets: ship.yaml postgres: is ship check's),
# at master: a release runs master's workflows. Two runs racing past their gates: ship release skips a commit behind
# master, whose own run releases it.
on:
  workflow_call:
    inputs:
      bump:
        type: string
        default: patch
      go-dir:
        type: string
        default: "."
      dir:
        description: A nested Go module to release instead (ship release -dir), e.g. kit; empty = the repo.
        type: string
        default: ""
      ship:
        description: How to run ship; empty = ship at master's sha on GitHub.
        type: string
        default: ""
      gate:
        description: Run check.yaml before releasing; false only where the same commit just passed it (ship's CI).
        type: boolean
        default: true
      node-version:
        description: >-
          Node for the gate's UI; empty = the node-version the caller's .github/workflows/ci.yaml sets up (conform
          keeps it the UI's node builder's), none there = no UI.
        type: string
        default: ""

jobs:
  # What gate and release share: the bump checked, one ship, the gate's Node and UI dir.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ship: ${{ steps.ship.outputs.cmd }}
      node: ${{ steps.node.outputs.node }}
      ui-dir: ${{ steps.node.outputs.ui-dir }}
    steps:
      # One ship for gate and release. Default: master's sha on GitHub, as the pre-push hook runs it. Not @master: the
      # module proxy can still serve an older master, and a release cannot be undone. Not github.job_workflow_sha:
      # empty for a caller (2026-10-11).
      - id: ship
        env:
          SHIP: ${{ inputs.ship }}
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in patch|minor|major|auto) ;; *) echo "::error::bump '$BUMP'"; exit 1 ;; esac
          if [ -z "$SHIP" ]; then
            # Exactly refs/heads/master: ls-remote matches by suffix, so x/refs/heads/master would match too.
            sha="$(git ls-remote https://github.com/trick77/ship refs/heads/master | awk '$2 == "refs/heads/master" { print $1 }')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve ship's master on GitHub: '$sha'"; exit 1; }
            SHIP="go run github.com/trick77/ship@$sha"
          fi
          echo "cmd=$SHIP" >> "$GITHUB_OUTPUT"
      - if: inputs.gate
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/ci.yaml
            ship.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Node and ui-dir as the caller's CI passes them to check.yaml: its ci.yaml is conform's render of the template
      # (block style, one check job, node-version = the UI's node builder's). A ci.yaml of another shape yields no
      # Node: with a UI that fails here (set node-version), never runs on the runner's preinstalled one.
      - id: node
        if: inputs.gate
        env:
          NODE: ${{ inputs.node-version }}
          CI_FILE: .github/workflows/ci.yaml
          SHIP_YAML: ship.yaml
        run: |
          ui=""
          if [ -f "$CI_FILE" ]; then
            [ -n "$NODE" ] || NODE="$(awk '$1 == "node-version:" { print $2; exit }' "$CI_FILE" | tr -d "\"'")"
            ui="$(awk '$1 == "ui-dir:" { print $2; exit }' "$CI_FILE" | tr -d "\"'")"
          fi
          if [ -z "$NODE" ] && [ -f "$SHIP_YAML" ] && grep -q '^ui:' "$SHIP_YAML"; then
            echo "::error::$SHIP_YAML has ui: but no node-version (input or $CI_FILE)"; exit 1
          fi
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
          echo "ui-dir=${ui:-ui}" >> "$GITHUB_OUTPUT"

  gate:
    needs: [resolve]
    if: inputs.gate
    permissions:
      contents: read
    uses: trick77/ship/.github/workflows/check.yaml@master
    with:
      go-dir: ${{ inputs.go-dir }}
      node-version: ${{ needs.resolve.outputs.node }}
      ui-dir: ${{ needs.resolve.outputs.ui-dir }}
      ship: ${{ needs.resolve.outputs.ship }}

  release:
    needs: [resolve, gate]
    # gate skipped (gate: false) releases; gate failed or cancelled does not.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && !inputs.gate))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Per module: their tags never collide, and a group holds one pending run only, cancelling a third.
      group: release-${{ github.repository }}-${{ inputs.dir }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Go: the newest patch of go.mod's major.minor, as check.yaml (the why there; a test keeps them one).
      - id: go
        env:
          MOD: ${{ inputs.go-dir }}/go.mod
        run: |
          [ -f "$MOD" ] || { echo "::error::$MOD: no such file (go-dir)"; exit 1; }
          v="$(awk '$1 == "go" || ($1 == "toolchain" && sub(/^go/, "", $2)) { split($2, p, "."); if (p[1] ~ /^[0-9]+$/ && (p[1] > a + 0 || (p[1] == a + 0 && p[2] + 0 > b))) { a = p[1] + 0; b = p[2] + 0 } } END { if (a != "") print a "." b }' "$MOD")"
          [[ "$v" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::$MOD: no go version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum
      # ship.yaml lives at the repo root; a top-level images: key (even an empty list) turns the docker steps on. A
      # nested module (dir) never builds them.
      - id: shape
        env:
          DIR: ${{ inputs.dir }}
        run: |
          if [ -z "$DIR" ] && [ -f ship.yaml ] && grep -q '^images:' ship.yaml; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          fi
      # Emulation for non-amd64 platforms (images.platforms, e.g. linux/arm64): a RUN step in a foreign-arch stage
      # cannot execute on the amd64 runner without it. Before buildx, so its builder sees the binfmt handlers.
      - if: steps.shape.outputs.images == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.shape.outputs.images == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.shape.outputs.images == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Exposes the Actions cache to buildx for --cache gha.
      - if: steps.shape.outputs.images == 'true'
        uses: crazy-max/ghaction-github-runtime@v4
      # Signs each pushed image's digest. No cosign-release input: the installer's default (checksum-pinned per installer
      # release) is the cosign, so Dependabot moving the installer moves cosign too (why: AGENTS.md).
      - if: steps.shape.outputs.images == 'true'
        uses: sigstore/cosign-installer@v4.1.3
      - working-directory: ${{ inputs.go-dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP: ${{ needs.resolve.outputs.ship }}
          BUMP: ${{ inputs.bump }}
          DIR: ${{ inputs.dir }}
        run: |
          # -dir only when set: a ship input from before -dir still runs.
          $SHIP release "$BUMP" -cache gha ${DIR:+-dir "$DIR"}
