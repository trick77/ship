version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: daily
    # `// indirect` too: by default Dependabot bumps only direct requirements, and a consumer inherits every
    # indirect floor kit sets (go-jose v4.1.4 behind go-oidc reached their images that way).
    allow:
      - dependency-type: all
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The nested modules (ship.yaml go.modules), each its own go.mod.
  - package-ecosystem: gomod
    directory: /kit
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /kit/auth
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  # The UI end-to-end fixture: kept on current React/vite/vitest so the test proves today's toolchain.
  - package-ecosystem: npm
    directory: /testdata/ui
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: daily
    groups:
      ui-fixture:
        patterns: ["*"]
